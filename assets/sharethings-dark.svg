<text x="36" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#2dd4bf">01 / featured</text><text x="36" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-0.6">ShareThings</text><rect x="246" y="72" width="58" height="22" rx="11" fill="#2dd4bf" opacity="0.14"/><circle cx="259" cy="83" r="4" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="269" y="87.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#2dd4bf">LIVE</text><text x="36" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#9198a1">Peer-to-peer video calls and screen sharing over WebRTC and Socket.IO.</text><text x="36" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#9198a1">Load-tested at 5,000 concurrent users with zero failed connections.</text><rect x="36" y="178" width="68" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="70.0" y="196.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9198a1" text-anchor="middle">WebRTC</text><rect x="112" y="178" width="60" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="142.0" y="196.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9198a1" text-anchor="middle">React</text><rect x="180" y="178" width="92" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="226.0" y="196.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9198a1" text-anchor="middle">Socket.IO</text><rect x="280" y="178" width="68" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="314.0" y="196.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9198a1" text-anchor="middle">Docker</text><rect x="620" y="76" width="84" height="62" rx="7" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/><circle cx="662" cy="100" r="9" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M644,128 q18,-20 36,0" fill="none" stroke="#2dd4bf" stroke-width="2"/><line x1="648" y1="152" x2="676" y2="152" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/><line x1="662" y1="138" x2="662" y2="152" stroke="#2dd4bf" stroke-width="2"/><rect x="836" y="76" width="84" height="62" rx="7" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/><circle cx="878" cy="100" r="9" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M860,128 q18,-20 36,0" fill="none" stroke="#2dd4bf" stroke-width="2"/><line x1="864" y1="152" x2="892" y2="152" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/><line x1="878" y1="138" x2="878" y2="152" stroke="#2dd4bf" stroke-width="2"/><path d="M712,104 L828,104" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/><path d="M828,128 L712,128" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/><circle r="3.5" fill="#2dd4bf"><animateMotion dur="1.6s" begin="-0s" repeatCount="indefinite" path="M712,104 L828,104"/></circle><circle r="3.5" fill="#2dd4bf"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" path="M712,104 L828,104"/></circle><circle r="3.5" fill="#2dd4bf"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite" path="M828,128 L712,128"/></circle><circle r="3.5" fill="#2dd4bf"><animateMotion dur="1.6s" begin="-1.2s" repeatCount="indefinite" path="M828,128 L712,128"/></circle>
