ill="#59636e" text-anchor="end">Jan 2026 – Jun 2026</text><text x="76" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" fill="#0369a1">Samsung R&amp;D Institute · Noida</text><text x="76" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#59636e">On-device Android system that reads prescriptions and lab reports, built with TensorFlow Lite and ONNX.</text><text x="76" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#59636e">5-stage ML pipeline (classify, detect, relate, OCR, post-process) in under 20 MB, 1–2 s latency, ~95% accuracy.</text>
